<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF2EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1512" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="التقويم">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<title>التقويم العائلي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=21.2.0">
</head>
<body>

<!-- شاشة البدء -->
<div id="boot" class="boot" aria-hidden="true">
  <div class="boot-moon" id="bootMoon"></div>
</div>

<!-- تسجيل الدخول -->
<section id="lock" class="lock" hidden>
  <div class="lock-inner">
    <div class="lock-head">
      <div class="lock-moon" id="lockMoon"></div>
      <h1 class="lock-title">التقويم العائلي</h1>
      <p class="lock-date" id="lockDate"></p>
    </div>
    <form id="authForm" class="auth-form" novalidate>
      <h2 id="authTitle" class="auth-title">تسجيل الدخول</h2>
      <label class="field" id="nameField" hidden>
        <span>الاسم الكامل</span>
        <input type="text" id="authName" autocomplete="name">
      </label>
      <label class="field">
        <span>البريد الإلكتروني</span>
        <input type="email" id="authEmail" inputmode="email" autocomplete="email" dir="ltr" required>
      </label>
      <label class="field">
        <span>كلمة المرور</span>
        <input type="password" id="authPassword" autocomplete="current-password" dir="ltr" minlength="6" required>
      </label>
      <label class="field" id="confirmField" hidden>
        <span>تأكيد كلمة المرور</span>
        <input type="password" id="authConfirm" autocomplete="new-password" dir="ltr" minlength="6">
      </label>
      <p class="form-msg" id="authMsg" role="alert"></p>
      <button type="submit" class="btn btn-primary btn-block" id="authSubmit">دخول</button>
      <div class="auth-links">
        <button type="button" class="link-btn" id="authSwitch">إنشاء حساب جديد</button>
        <button type="button" class="link-btn" id="authReset">نسيت كلمة المرور؟</button>
      </div>
    </form>
    <form id="resetForm" class="auth-form" novalidate hidden>
      <h2 class="auth-title">تعيين كلمة مرور جديدة</h2>
      <p class="reset-for">للحساب: <b id="resetEmail" dir="ltr"></b></p>
      <label class="field">
        <span>كلمة المرور الجديدة <button type="button" class="link-btn pw-toggle" data-pw-toggle="resetPw">إظهار</button></span>
        <input type="password" id="resetPw" autocomplete="new-password" dir="ltr" minlength="6" required>
      </label>
      <label class="field">
        <span>تأكيد كلمة المرور الجديدة</span>
        <input type="password" id="resetConfirm" autocomplete="new-password" dir="ltr" minlength="6" required>
      </label>
      <p class="form-msg" id="resetMsg" role="alert"></p>
      <button type="submit" class="btn btn-primary btn-block" id="resetSubmit">حفظ كلمة المرور</button>
      <div class="auth-links"><button type="button" class="link-btn" id="resetBack">رجوع لتسجيل الدخول</button></div>
    </form>
  </div>
</section>

<!-- التطبيق -->
<div id="app" class="app" hidden>
  <header class="top">
    <div class="top-bar">
      <div class="greet">
        <span id="greetText"></span>
        <button type="button" class="sync" id="syncBtn" aria-live="polite"><i class="sync-dot"></i><span id="syncText">متزامن</span></button>
      </div>
      <button type="button" class="avatar" id="avatarBtn" aria-label="حسابي"><span id="avatarLetter"></span><b class="badge" id="avatarBadge" hidden></b></button>
    </div>
    <div class="today">
      <div class="today-moon" id="todayMoon"></div>
      <div class="today-text">
        <div class="today-hijri" id="todayHijri"></div>
        <div class="today-greg" id="todayGreg"></div>
      </div>
    </div>
  </header>

  <main class="main">
    <!-- القائمة -->
    <section id="viewList" class="view">
      <div id="invites"></div>
      <div class="list-tools">
        <label class="search">
          <svg class="ico" aria-hidden="true"><use href="#i-search"/></svg>
          <input type="search" id="searchInput" placeholder="ابحث في المواعيد" aria-label="ابحث في المواعيد">
        </label>
        <div class="seg" role="tablist" id="filterSeg">
          <button type="button" role="tab" data-filter="upcoming" class="on">القادمة <small id="cUp"></small></button>
          <button type="button" role="tab" data-filter="past">الفائتة <small id="cPast"></small></button>
          <button type="button" role="tab" data-filter="all">الكل <small id="cAll"></small></button>
        </div>
      </div>
      <div id="eventList" class="event-list"></div>
    </section>

    <!-- الشهر -->
    <section id="viewMonth" class="view" hidden>
      <div class="month-head">
        <button type="button" class="icon-btn" id="monthPrev" aria-label="الشهر السابق"><svg class="ico"><use href="#i-chev-right"/></svg></button>
        <div class="month-title">
          <h2 id="monthTitle"></h2>
          <p id="monthSub"></p>
        </div>
        <button type="button" class="icon-btn" id="monthNext" aria-label="الشهر التالي"><svg class="ico"><use href="#i-chev-left"/></svg></button>
      </div>
      <div class="month-ctrl">
        <div class="seg seg-sm" id="gridCalSeg">
          <button type="button" data-cal="greg" class="on">ميلادي</button>
          <button type="button" data-cal="hijri">هجري</button>
        </div>
        <button type="button" class="chip-btn" id="monthToday">اليوم</button>
      </div>
      <div class="grid-week" id="gridWeek"></div>
      <div class="grid" id="monthGrid"></div>
      <div class="day-panel" id="dayPanel"></div>
    </section>
  </main>

  <nav class="tabbar" aria-label="التنقل">
    <button type="button" class="tab on" data-view="list"><svg class="ico"><use href="#i-list"/></svg><span>المواعيد</span></button>
    <button type="button" class="tab" data-view="month"><svg class="ico"><use href="#i-cal"/></svg><span>الشهر</span></button>
    <button type="button" class="tab-add" id="addBtn" aria-label="إضافة موعد"><svg class="ico"><use href="#i-plus"/></svg></button>
    <button type="button" class="tab" id="toolsBtn"><svg class="ico"><use href="#i-tools"/></svg><span>الأدوات</span></button>
    <button type="button" class="tab" id="accountBtn"><svg class="ico"><use href="#i-user"/></svg><span>حسابي</span></button>
  </nav>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- الأيقونات -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></symbol>
    <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-tools" viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.6"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="4"/><path d="M4.5 20.5c1.2-4 4-6 7.5-6s6.3 2 7.5 6"/></symbol>
    <symbol id="i-chev-left" viewBox="0 0 24 24"><path d="m14.5 6-6 6 6 6"/></symbol>
    <symbol id="i-chev-right" viewBox="0 0 24 24"><path d="m9.5 6 6 6-6 6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M4 11V9.5A3.5 3.5 0 0 1 7.5 6H19l-3-3M20 13v1.5a3.5 3.5 0 0 1-3.5 3.5H5l3 3"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><path d="M6 3.5h8.5L19 8v12.5H6z"/><path d="M14 3.5V8h5M9 12.5h7M9 16h5"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8.5" r="3.5"/><path d="M2.5 19.5c.8-3.3 3.3-5 6.5-5s5.7 1.7 6.5 5"/><path d="M16 5.2a3.5 3.5 0 0 1 0 6.6M18 14.8c1.8.6 3 2.2 3.5 4.7"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 15V3.5M8 7.5l4-4 4 4"/><path d="M6 11H5v9.5h14V11h-1"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15M10 7V4.5h4V7M6.5 7l1 13h9l1-13"/></symbol>
    <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V4M5 4.5h12l-2 4 2 4H5"/></symbol>
    <symbol id="i-ruler" viewBox="0 0 24 24"><path d="M3.5 12h17M3.5 12l3-3M3.5 12l3 3M20.5 12l-3-3M20.5 12l-3 3"/></symbol>
    <symbol id="i-archive" viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="4.5" rx="1"/><path d="M5 8.5v11h14v-11M10 12.5h4"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M10.5 18.5h3"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3.5 5 6v5.5c0 4.3 3 7.6 7 9 4-1.4 7-4.7 7-9V6z"/><path d="m9 12 2 2 4-4"/></symbol>
    <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="m11 12 8.5-8.5M16 7l2.5 2.5M14 9l2 2"/></symbol>
    <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3.5" y="5.5" width="17" height="13" rx="2"/><path d="m4 7 8 6 8-6"/></symbol>
    <symbol id="i-logout" viewBox="0 0 24 24"><path d="M14 4.5H5.5v15H14M10 12h10.5M17 8.5l3.5 3.5-3.5 3.5"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19.5h14"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5M5 19.5h14"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M3.5 13.5 6 5h12l2.5 8.5v6h-17z"/><path d="M3.5 13.5H9l1 2h4l1-2h5.5"/></symbol>
  </defs>
</svg>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="js/core.js?v=21.2.0"></script>
<script src="js/data.js?v=21.2.0"></script>
<script src="js/ui.js?v=21.2.0"></script>
<script src="https://adelss12.github.io/back.js" defer></script>
</body>
</html>
